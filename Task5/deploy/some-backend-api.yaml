apiVersion: apps/v1
kind: Deployment
metadata:
  name: some-back-end-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: some-back-end-api
  template:
    metadata:
      labels:
        app: some-back-end-api
        role: back-end-api
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80
